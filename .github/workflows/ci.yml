name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm check:codegen
      - run: pnpm check:licenses
      - run: pnpm audit:deps
      - run: pnpm build
      - run: pnpm test:cov
      - name: Pack audit
        run: |
          set -euo pipefail
          fail=0
          for d in packages/modules/*/; do
            (
              cd "$d"
              npm pack --dry-run --json > /tmp/p.json || exit 1
              node -e '
                const j = require("/tmp/p.json")[0];
                const names = j.files.map(f => f.path);
                const has = (p) => names.some(n => n === p || n.startsWith(p + "/"));
                const pkg = require(process.cwd() + "/package.json");
                if (!has("lynx.lib.json")) { console.error(pkg.name + ": lynx.lib.json missing"); process.exit(1); }
                for (const twin of ["android", "ios"]) {
                  if (require("fs").existsSync(twin) && !has(twin)) { console.error(pkg.name + ": twin " + twin + " missing"); process.exit(1); }
                }
              ' || exit 1
            ) || { echo "pack audit failed: $d"; fail=1; }
          done
          exit $fail

  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status

  native-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:native:android

  native-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: "3.2"
      - run: gem install cocoapods --no-document
      - run: gem install cocoapods-lynx-library -v 4.2.0 --no-document
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pod install
        working-directory: packages/playground/src/host
      - run: pnpm check:native:ios
