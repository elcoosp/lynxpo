[workspace]
resolver = "2"
members = ["nmb-cli", "nmb-core", "nmb-lint", "nmb-ts"]
[workspace.dependencies]

serde = { version = "1.0.219", features = ["derive"] }
clap = { version = "4.5.32", features = ["derive"] }
serde_json = { version = "1.0.140" }
env_logger = { version = "0.11.7" }
log = { version = "0.4.26" }
similar = { version = "2.7.0" }
thiserror = { version = "2.0.12" }
anyhow = { version = "1.0.97" }
schemars = { version = "1.0.0-alpha.17" }
ordermap = { version = "0.5.6", features = ["serde"] }
ts_quote = "0.4.0"
terminal_hyperlink = "0.1.0"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14.0"
build-print = "0.1.1"
cmd_lib = { git = "https://github.com/elcoosp/rust_cmd_lib", features = [
    "build-print",
], branch = "feat/build-script-log" }
