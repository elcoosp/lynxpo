syntax = "proto3";

package model;

message SourceLocation {
  string file_path = 1;
  int32 start_line = 2;
  int32 start_column = 3;
  int32 end_line = 4;
  int32 end_column = 5;
}

message TypeInfo {
  string full_name = 1;
  string name = 2;
  bool is_nullable = 3;
  repeated TypeInfo type_arguments = 4;
  optional string custom_return_hint = 5;
  string doc = 6;
  SourceLocation location = 7;
}

message ParameterInfo {
  string name = 1;
  TypeInfo type_info = 2;
  bool has_default_value = 3;
  string doc = 4;
  SourceLocation location = 5;
}

enum Visibility {
  PUBLIC = 0;
  INTERNAL = 1;
  PROTECTED = 2;
  PRIVATE = 3;
}

message MethodInfo {
  string name = 1;
  TypeInfo return_type = 2;
  repeated ParameterInfo parameters = 3;
  optional TypeInfo receiver_type = 4;
  Visibility visibility = 5;
  bool is_extension = 6;
  bool is_inline = 7;
  bool is_async = 8;
  string doc = 9;
  SourceLocation location = 10;
}

enum TypeKind {
  CLASS = 0;
  INTERFACE = 1;
  ENUM = 2;
  OBJECT = 3;
  STRUCT = 4;
}

message PropertyDefinition {
  string name = 1;
  TypeInfo type_info = 2;
  SourceLocation location = 3;
}

message EnumValue {
  string name = 1;
  repeated string property_values = 2;
  string doc = 3;
  SourceLocation location = 4;
}

message SerializableTypeInfo {
  string full_name = 1;
  string name = 2;
  TypeKind kind = 3;
  repeated PropertyDefinition property_definitions = 4;
  repeated EnumValue enum_values = 5;
  string doc = 6;
  SourceLocation location = 7;
}

message TypeInfoFile {
  string full_name = 1;
  string name = 2;
  repeated MethodInfo methods = 3;
  string generic_metadata = 4;
  repeated SerializableTypeInfo serializable_types = 5;
  string doc = 6;
  SourceLocation location = 7;
}