language: Kotlin
id: async-coroutine-functions-with-params-without-retty
rewriters:
  # TODO: find correct conversion
  - id: wrap-coroutine-body
    rule:
      kind: statements
      pattern: $STMT
    fix: |
      runBlocking {
        launch {
          $STMT
        }
      }
rule:
  matches: is-coroutine-fn-p
  pattern: |
    AsyncFunction("$NAME") Coroutine { $PARAMS ->
      $$$BODY
    }
transform:
  DESUGARED_BODY:
    rewrite:
      rewriters: [wrap-coroutine-body]
      source: $$$BODY

fix: |
  @LynxMethod
  fun $NAME($PARAMS, callback: Callback) {
    $DESUGARED_BODY
  }

---
language: Kotlin
id: replace-coroutine-returns
rule:
  kind: jump_expression
  pattern: return@Coroutine $RET_VALUE
  inside:
    kind: statements
    inside:
      any:
        - kind: try_expression
          inside:
            kind: statements
            inside:
              kind: lambda_literal
        - kind: lambda_literal
fix: return@launch callback.invoke(LynxUIMethodConstants.SUCCESS, $RET_VALUE)
---
language: Kotlin
id: replace-coroutine-throws
rule:
  kind: jump_expression
  pattern: throw $ERR
  inside:
    kind: statements
    inside:
      any:
        - kind: catch_block
          inside:
            kind: try_expression
            inside:
              kind: statements
              inside:
                kind: lambda_literal
        - kind: lambda_literal
fix: |
  val lynxErr = $ERR
  return@launch callback.invoke(LynxUIMethodConstants.OPERATION_ERROR, lynxErr.code, lynxErr.toString())
