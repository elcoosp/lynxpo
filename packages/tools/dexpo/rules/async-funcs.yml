id: async-functions-resolve
language: Kotlin
rule:
  kind: jump_expression
  pattern: |
    return@AsyncFunction $RET_VALUE
fix: return promise.resolve($RET_VALUE)
---

id: async-functions-with-params-with-retty
language: Kotlin
rule:
  any:
    - kind: call_expression
      pattern: AsyncFunction<$RET_TYPE>("$NAME") { $PARAMS -> $$$BODY }
    - kind: call_expression
      pattern: |
        AsyncFunction<$RET_TYPE>("$NAME") { $PARAMS ->
          $$$BODY
        }
fix: |
  @LynxMethod
  fun $NAME($PARAMS, promise: Promise): $RET_TYPE {
    $$$BODY
  }
