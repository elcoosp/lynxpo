id: package
language: Kotlin
rule:
  kind: package_header
  pattern: |
    package expo.modules.$NAME
fix: |
    // FIXME: inject real package name 
    package com.{{org}}.{{project_name|camel_case}}.modules.$NAME

---
id: imports-utils-ifNull
language: Kotlin
rule:
  pattern: import expo.modules.core.utilities.ifNull
  not:
    follows:
      pattern: import java.io.File
fix: |
  inline fun <T> T?.ifNull(block: () -> T): T = this ?: block()
  inline fun <reified T> Any?.takeIfInstanceOf(): T? = this as? T
---
id: imports-utils-ifNull-follows-import
language: Kotlin
rule:
  pattern: import $IMPORT
  follows:
    pattern: import expo.modules.core.utilities.ifNull
fix: |
  import $IMPORT
  inline fun <T> T?.ifNull(block: () -> T): T = this ?: block()
  inline fun <reified T> Any?.takeIfInstanceOf(): T? = this as? T
---
id: imports-removed
language: Kotlin
rule:
  kind: import_header
  inside:
    kind: import_list
  # TODO Replace expo.modules.core.{utilities} by lynxpo shared package subset (eg EmulatorUtilities)
  any:
    # TODO create own version
    - pattern: import expo.modules.kotlin.exception.CodedException
    - pattern: import expo.modules.kotlin.functions.Coroutine
    - pattern: import expo.modules.kotlin.modules.Module
    - pattern: import expo.modules.kotlin.modules.ModuleDefinition
    - pattern: import expo.modules.kotlin.records.Field
    - pattern: import expo.modules.kotlin.types.Enumerable
  # was pattern: import expo.modules.kotlin.$_
fix: ""

---
id: imports-removed
language: Kotlin
rule:
  pattern: import expo.modules.kotlin.records.Record
fix: |
  import com.lynx.react.bridge.ReadableMap
  import kotlinx.serialization.*



# Needed to split in two rules because the getter may be on the next line, and not correctly wrapped inside prop_decl
---
id: expo-context-prop-decl
language: Kotlin
rule:
  kind: property_declaration
  any:
    - pattern: |
        private val context: Context
    - pattern: |
        private val context
  inside:
    kind: class_body
fix: |
  private fun getContext(): Context {
    val lynxContext = mContext as LynxContext
    return lynxContext.getContext()
  }

---

id: expo-context-getter
language: Kotlin
rule:
  kind: getter
  any:
    - pattern: |
        get() = requireNotNull(appContext.reactContext) {
          "React Application Context is null"
        }
    - pattern: |
        get() = appContext.reactContext ?: throw Exceptions.ReactContextLost()
  inside:
    kind: class_body
fix: ""

---
id: module-name
language: Kotlin
rule:
  kind: call_expression
  pattern: Name("$NAME")
fix: ""
