language: Kotlin
id: serializable-class
rewriters:
  - id: unfield-annot-with-default
    rule:
      any:
        - pattern: |
            @Field($$$_) var $FNAME: $TY = $DEFAULT
        - pattern: |
            @Field var $FNAME: $TY = $DEFAULT
    fix: |
        var $FNAME: $TY = $DEFAULT
  - id: unfield-annot-without-default
    rule:
      any:
        - pattern: |
            @Field($$$_) var $FNAME: $TY
        - pattern: |
            @Field var $FNAME: $TY
    fix: |
        abstract var $FNAME: $TY

rule:
  pattern: |
    internal class $NAME : Record {
      $$$CLASS_BODY
    }


transform:
  UPDATED_BODY:
    rewrite:
      rewriters: [unfield-annot-with-default, unfield-annot-without-default]
      source: $$$CLASS_BODY
fix: |
  @Serializable
  abstract class $NAME : ReadableMap {
    $UPDATED_BODY
  }