---

id: module-base-class
language: Kotlin
rewriters:
  - id: pre
    rule:
      kind: source_file
      has:
        kind: import_list
    fix: |
      import com.lynx.jsbridge.LynxMethod
      import com.lynx.jsbridge.LynxModule
      import com.lynx.jsbridge.Promise
      import com.lynx.tasm.behavior.LynxContext
      // TODO move in dedicated package
      import LynxpoModule
  - id: inner
    rule:
      kind: class_declaration
      pattern: |
        class $MODULE : Module() {
            $$$BODY
        }
    fix: |
      class $MODULE(private val context: Context) : LynxpoModule(context) {
        $$$BODY
      }


rule:
  kind: source_file
  pattern: $SF
  has:
    any:
      - pattern: |
          class $MODULE : Module() {
              $$$BODY
          }

transform:
  UPDATED_PRE:
    rewrite:
      rewriters: [pre]
      source: $SF
  UPDATED_INNER:
    rewrite:
      rewriters: [inner]
      source: $SF
fix: |
  $UPDATED_PRE
  $UPDATED_INNER
