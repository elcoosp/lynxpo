packages:
  - "packages/*"
  - "packages/modules/*"

overrides:
  esbuild: ">=0.25.0"
  fast-uri: ">=3.1.9"
  postcss-selector-parser: ">=7.1.6"
  source-map-js: ">=1.2.2"

allowBuilds:
  core-js: false
  esbuild: true
  protobufjs: false

minimumReleaseAgeExclude:
  - "@babel/types@8.1.0"
  - "@vitest/coverage-v8@5.1.0"
  - "@vitest/mocker@5.1.0"
  - "@vitest/spy@5.1.0"
  - vitest@5.1.0
  - "@rslib/core@1.0.6"
  - rsbuild-plugin-dts@1.0.6

onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@swc/core"
  - esbuild
